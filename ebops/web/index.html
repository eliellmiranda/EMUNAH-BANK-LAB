<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EBOPS — Emunah Bank Operations Simulator</title>
<style>
:root {
  --bg: #0d1117;
  --bg2: #161b22;
  --bg3: #21262d;
  --border: #30363d;
  --text: #c9d1d9;
  --text2: #8b949e;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
  --blue: #58a6ff;
  --cyan: #39d353;
  --magenta: #bc8cff;
  --orange: #f0883e;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Cascadia Code','Fira Code','Consolas',monospace;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
a { color: var(--blue); text-decoration: none; }

/* ── Header ── */
.header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header h1 {
  font-size: 16px;
  color: var(--green);
  letter-spacing: 1px;
}
.header h1 span { color: var(--text2); font-weight: normal; }
.header-actions { display: flex; gap: 8px; }

/* ── Buttons ── */
.btn {
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg3);
  color: var(--text);
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  transition: all .15s;
}
.btn:hover { border-color: var(--text2); background: var(--border); }
.btn-green { border-color: var(--green); color: var(--green); }
.btn-green:hover { background: var(--green); color: var(--bg); }
.btn-red { border-color: var(--red); color: var(--red); }
.btn-red:hover { background: var(--red); color: #fff; }
.btn-blue { border-color: var(--blue); color: var(--blue); }
.btn-blue:hover { background: var(--blue); color: var(--bg); }
.btn-yellow { border-color: var(--yellow); color: var(--yellow); }
.btn-yellow:hover { background: var(--yellow); color: var(--bg); }
.btn-sm { padding: 3px 8px; font-size: 11px; }

/* ── Tabs ── */
.tabs {
  display: flex;
  gap: 0;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
}
.tab {
  padding: 10px 18px;
  font-size: 13px;
  color: var(--text2);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all .15s;
  font-family: inherit;
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--green); border-bottom-color: var(--green); }

/* ── Layout ── */
.main { padding: 20px 24px; max-width: 1400px; margin: 0 auto; }
.section { display: none; }
.section.active { display: block; }

/* ── Cards ── */
.card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 12px;
}
.card h3 {
  font-size: 13px;
  color: var(--green);
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: .5px;
}

/* ── Stats row ── */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
.stat {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  text-align: center;
}
.stat .value {
  font-size: 28px;
  font-weight: bold;
  color: var(--green);
}
.stat .label {
  font-size: 11px;
  color: var(--text2);
  margin-top: 4px;
  text-transform: uppercase;
}

/* ── Batch table ── */
.batch-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.batch-table th {
  text-align: left;
  padding: 8px 10px;
  color: var(--text2);
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  text-transform: uppercase;
}
.batch-table td {
  padding: 6px 10px;
  border-bottom: 1px solid rgba(48,54,61,.5);
}
.batch-table tr:hover td { background: rgba(48,54,61,.3); }
.st-ok { color: var(--green); }
.st-error { color: var(--red); font-weight: bold; }
.st-warning { color: var(--yellow); }
.st-hold { color: var(--orange); }
.st-pending { color: var(--text2); }

/* ── Kanban board ── */
.kanban {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-top: 12px;
}
.kanban-col {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  min-height: 300px;
}
.kanban-col-header {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  font-weight: bold;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.kanban-col-header .count {
  background: var(--bg3);
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  color: var(--text2);
}
.kanban-col-body { padding: 8px; }

.ticket-card {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: border-color .15s;
}
.ticket-card:hover { border-color: var(--text2); }
.ticket-card .ticket-id {
  font-size: 11px;
  color: var(--cyan);
  margin-bottom: 4px;
}
.ticket-card .ticket-title {
  font-size: 12px;
  margin-bottom: 6px;
  line-height: 1.4;
}
.ticket-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 3px;
  border: 1px solid;
}
.tag-sev-critica { color: var(--red); border-color: var(--red); }
.tag-sev-alta { color: var(--yellow); border-color: var(--yellow); }
.tag-sev-media { color: var(--cyan); border-color: var(--cyan); }
.tag-sev-baixa { color: var(--green); border-color: var(--green); }
.tag-cat { color: var(--magenta); border-color: var(--magenta); }
.tag-dif { color: var(--blue); border-color: var(--blue); }
.tag-inj { color: var(--orange); border-color: var(--orange); }

/* ── Injection list ── */
.inj-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 10px;
}
.inj-card {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 12px;
}
.inj-card .inj-id { color: var(--orange); font-size: 11px; font-weight: bold; }
.inj-card .inj-title { font-size: 12px; margin: 4px 0; }
.inj-card .inj-detail { font-size: 11px; color: var(--text2); margin: 2px 0; }

/* ── Active injections ── */
.active-inj {
  background: rgba(248,81,73,.08);
  border: 1px solid rgba(248,81,73,.3);
  border-radius: 6px;
  padding: 10px 14px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.active-inj .inj-info { flex: 1; }

/* ── Modal ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 200;
  justify-content: center;
  align-items: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  width: 560px;
  max-width: 95vw;
  max-height: 85vh;
  overflow-y: auto;
  padding: 20px;
}
.modal h2 {
  font-size: 15px;
  color: var(--green);
  margin-bottom: 14px;
}
.modal label {
  font-size: 11px;
  color: var(--text2);
  text-transform: uppercase;
  display: block;
  margin-bottom: 4px;
  margin-top: 10px;
}
.modal textarea {
  width: 100%;
  min-height: 80px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-family: inherit;
  font-size: 12px;
  padding: 8px;
  resize: vertical;
}
.modal .modal-actions {
  display: flex;
  gap: 8px;
  margin-top: 16px;
  justify-content: flex-end;
}
.modal select {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: inherit;
  font-size: 12px;
  padding: 6px 8px;
  border-radius: 4px;
  width: 100%;
}

/* ── Toast ── */
.toast-container {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 300;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toast {
  padding: 10px 16px;
  border-radius: 6px;
  font-size: 12px;
  animation: toast-in .3s;
  border: 1px solid;
}
.toast-ok { background: rgba(63,185,80,.15); border-color: var(--green); color: var(--green); }
.toast-err { background: rgba(248,81,73,.15); border-color: var(--red); color: var(--red); }
.toast-info { background: rgba(88,166,255,.15); border-color: var(--blue); color: var(--blue); }
@keyframes toast-in { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }

/* ── Filter bar ── */
.filter-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  align-items: center;
}
.filter-bar input {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-family: inherit;
  font-size: 12px;
  padding: 6px 10px;
  flex: 1;
  max-width: 300px;
}
.filter-bar input::placeholder { color: var(--text2); }

/* ── Responsive ── */
@media (max-width: 900px) {
  .kanban { grid-template-columns: 1fr 1fr; }
  .stats { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 600px) {
  .kanban { grid-template-columns: 1fr; }
  .tabs { overflow-x: auto; }
  .header { flex-direction: column; gap: 8px; }
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border); }

/* ── Loading ── */
.loading {
  text-align: center;
  padding: 40px;
  color: var(--text2);
}
.spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 2px solid var(--border);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin .6s linear infinite;
  margin-right: 8px;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- ═══════ HEADER ═══════ -->
<div class="header">
  <h1>EBOPS <span>— Emunah Bank Operations Simulator</span></h1>
  <div class="header-actions">
    <button class="btn btn-green" onclick="gerarDia()">+ Novo Dia</button>
    <button class="btn btn-yellow" onclick="exportar()">Exportar</button>
    <button class="btn btn-red" onclick="resetar()">Reset</button>
  </div>
</div>

<!-- ═══════ TABS ═══════ -->
<div class="tabs">
  <button class="tab active" data-tab="dashboard">Dashboard</button>
  <button class="tab" data-tab="tickets">Tickets</button>
  <button class="tab" data-tab="injecoes">Injeções</button>
  <button class="tab" data-tab="historico">Histórico</button>
</div>

<!-- ═══════ MAIN ═══════ -->
<div class="main">

  <!-- ─── Dashboard ─── -->
  <div id="sec-dashboard" class="section active">
    <div class="stats" id="stats-row">
      <div class="stat"><div class="value" id="st-dia">-</div><div class="label">Dia Atual</div></div>
      <div class="stat"><div class="value" id="st-tickets">-</div><div class="label">Tickets</div></div>
      <div class="stat"><div class="value" id="st-inj">-</div><div class="label">Injeções Ativas</div></div>
      <div class="stat"><div class="value" id="st-hist">-</div><div class="label">Histórico</div></div>
    </div>

    <div class="card">
      <h3>Grade Batch</h3>
      <div style="display:flex;gap:8px;margin-bottom:10px;">
        <button class="btn btn-sm btn-green" onclick="loadBatch(false)">Batch Normal</button>
        <button class="btn btn-sm btn-red" onclick="loadBatch(true)">Simular Falha</button>
      </div>
      <table class="batch-table">
        <thead><tr><th>Job</th><th>Hora</th><th>Programa</th><th>Status</th><th>RC</th></tr></thead>
        <tbody id="batch-body"></tbody>
      </table>
    </div>
  </div>

  <!-- ─── Tickets ─── -->
  <div id="sec-tickets" class="section">
    <div class="filter-bar">
      <input type="text" id="filtro-tickets" placeholder="Filtrar por categoria, severidade, status, título..." oninput="loadTickets()">
      <button class="btn btn-sm" onclick="document.getElementById('filtro-tickets').value='';loadTickets()">Limpar</button>
    </div>
    <div class="kanban" id="kanban-board"></div>
  </div>

  <!-- ─── Injeções ─── -->
  <div id="sec-injecoes" class="section">
    <div class="card">
      <h3>Injeções Ativas</h3>
      <div id="active-inj-list"><p style="color:var(--text2);font-size:12px;">Nenhuma injeção ativa.</p></div>
    </div>
    <div class="card">
      <h3>Catálogo de Injeções</h3>
      <div class="inj-grid" id="inj-catalog"></div>
    </div>
  </div>

  <!-- ─── Histórico ─── -->
  <div id="sec-historico" class="section">
    <div class="card">
      <h3>Injeções Revertidas</h3>
      <div id="history-list"><p style="color:var(--text2);font-size:12px;">Nenhum registro.</p></div>
    </div>
  </div>

</div>

<!-- ═══════ MODAL: Ticket Detail ═══════ -->
<div class="modal-overlay" id="modal-ticket">
  <div class="modal">
    <h2 id="modal-ticket-title"></h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div><label>ID</label><div id="md-id" style="font-size:13px;color:var(--cyan);"></div></div>
      <div><label>Dia</label><div id="md-dia" style="font-size:13px;"></div></div>
      <div><label>Categoria</label><div id="md-cat" style="font-size:13px;"></div></div>
      <div><label>Severidade</label><div id="md-sev" style="font-size:13px;"></div></div>
      <div><label>Dificuldade</label><div id="md-dif" style="font-size:13px;"></div></div>
      <div><label>Tempo</label><div id="md-tempo" style="font-size:13px;"></div></div>
      <div><label>Ferramenta</label><div id="md-fer" style="font-size:13px;"></div></div>
      <div><label>Injeção</label><div id="md-inj" style="font-size:13px;"></div></div>
    </div>
    <label>Descrição</label>
    <div id="md-desc" style="font-size:12px;color:var(--text);background:var(--bg);padding:8px;border-radius:4px;white-space:pre-wrap;"></div>
    <label>Status</label>
    <select id="md-status" onchange="moveTicketFromModal()">
      <option value="backlog">Backlog</option>
      <option value="em_andamento">Em Andamento</option>
      <option value="em_revisao">Em Revisão</option>
      <option value="concluido">Concluído</option>
    </select>
    <label>Notas</label>
    <textarea id="md-notas" placeholder="Anote observações aqui..."></textarea>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('modal-ticket')">Fechar</button>
      <button class="btn btn-green" onclick="salvarNotas()">Salvar Notas</button>
    </div>
  </div>
</div>

<!-- ═══════ MODAL: Injection Result ═══════ -->
<div class="modal-overlay" id="modal-inject-result">
  <div class="modal">
    <h2>Injeção Aplicada</h2>
    <label>ID</label><div id="mir-id" style="font-size:13px;color:var(--orange);"></div>
    <label>Título</label><div id="mir-title" style="font-size:13px;"></div>
    <label>Arquivos Afetados</label><div id="mir-files" style="font-size:12px;color:var(--text2);"></div>
    <label>Sintoma Observável</label><div id="mir-sintoma" style="font-size:12px;color:var(--yellow);"></div>
    <label>Dica</label><div id="mir-dica" style="font-size:12px;color:var(--cyan);"></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('modal-inject-result')">OK</button>
    </div>
  </div>
</div>

<!-- ═══════ MODAL: Novo Dia Result ═══════ -->
<div class="modal-overlay" id="modal-dia">
  <div class="modal">
    <h2 id="modal-dia-title">Novo Dia Gerado</h2>
    <div id="modal-dia-body"></div>
    <div class="modal-actions">
      <button class="btn btn-green" onclick="closeModal('modal-dia')">OK</button>
    </div>
  </div>
</div>

<!-- ═══════ TOAST ═══════ -->
<div class="toast-container" id="toast-container"></div>

<script>
// ═══════════════════════════════════════════════════════
// API BASE
// ═══════════════════════════════════════════════════════
const API = '';

async function api(path, opts) {
  try {
    const res = await fetch(API + path, opts);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  } catch(e) {
    toast(e.message, 'err');
    throw e;
  }
}

// ═══════════════════════════════════════════════════════
// TABS
// ═══════════════════════════════════════════════════════
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('sec-' + tab.dataset.tab).classList.add('active');
    // Refresh data on tab switch
    const t = tab.dataset.tab;
    if (t === 'dashboard') { loadInfo(); loadBatch(false); }
    else if (t === 'tickets') loadTickets();
    else if (t === 'injecoes') { loadActiveInjections(); loadCatalog(); }
    else if (t === 'historico') loadHistory();
  });
});

// ═══════════════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════════════
function toast(msg, type='ok') {
  const el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

// ═══════════════════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════════════════
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
});

// ═══════════════════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════════════════
async function loadInfo() {
  try {
    const d = await api('/api/info');
    document.getElementById('st-dia').textContent = d.day;
    document.getElementById('st-tickets').textContent = d.total_tickets;
    document.getElementById('st-inj').textContent = d.active_injections;
    document.getElementById('st-hist').textContent = d.history_count;
  } catch(e) {}
}

async function loadBatch(fail) {
  try {
    const jobs = await api('/api/batch?fail=' + fail);
    const tbody = document.getElementById('batch-body');
    tbody.innerHTML = jobs.map(j => `
      <tr>
        <td style="font-weight:bold;">${j.job}</td>
        <td>${j.hora}</td>
        <td>${j.pgm}</td>
        <td class="st-${j.status}">${j.status.toUpperCase()}</td>
        <td class="st-${j.status}">${j.rc}</td>
      </tr>
    `).join('');
  } catch(e) {}
}

// ═══════════════════════════════════════════════════════
// TICKETS (KANBAN)
// ═══════════════════════════════════════════════════════
const STATUS_ORDER = ['backlog','em_andamento','em_revisao','concluido'];
const STATUS_NAMES = {backlog:'Backlog',em_andamento:'Em Andamento',em_revisao:'Em Revisão',concluido:'Concluído'};
const CAT_ICONS = {incidente:'🔥',desenvolvimento:'⚙️','operação':'📋',change:'🔄','investigação':'🔍'};
let currentTickets = [];

async function loadTickets() {
  const filtro = document.getElementById('filtro-tickets').value;
  try {
    const d = await api('/api/tickets?filtro=' + encodeURIComponent(filtro));
    currentTickets = d.tickets;
    renderKanban(d.tickets, d.counts);
  } catch(e) {}
}

function renderKanban(tickets, counts) {
  const board = document.getElementById('kanban-board');
  board.innerHTML = STATUS_ORDER.map(st => {
    const col_tickets = tickets.filter(t => t.status === st);
    const count = counts[st] || 0;
    return `
      <div class="kanban-col">
        <div class="kanban-col-header">
          ${STATUS_NAMES[st]}
          <span class="count">${count}</span>
        </div>
        <div class="kanban-col-body">
          ${col_tickets.length === 0 ? '<div style="text-align:center;color:var(--text2);font-size:11px;padding:20px;">—</div>' :
            col_tickets.map(t => renderTicketCard(t)).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function renderTicketCard(t) {
  const icon = CAT_ICONS[t.categoria] || '📋';
  const sevClass = 'tag-sev-' + (t.severidade || 'media');
  return `
    <div class="ticket-card" onclick="openTicket('${t.ticket_id}')">
      <div class="ticket-id">${t.ticket_id}</div>
      <div class="ticket-title">${icon} ${t.titulo}</div>
      <div class="ticket-tags">
        <span class="tag ${sevClass}">${(t.severidade||'media').toUpperCase()}</span>
        <span class="tag tag-cat">${t.categoria}</span>
        <span class="tag tag-dif">${t.dificuldade}</span>
        ${t.inj ? '<span class="tag tag-inj">⚡'+t.inj+'</span>' : ''}
      </div>
    </div>
  `;
}

let currentTicketId = null;
function openTicket(id) {
  const t = currentTickets.find(x => x.ticket_id === id);
  if (!t) return;
  currentTicketId = id;
  document.getElementById('modal-ticket-title').textContent = t.titulo;
  document.getElementById('md-id').textContent = t.ticket_id;
  document.getElementById('md-dia').textContent = 'Dia #' + t.dia;
  document.getElementById('md-cat').textContent = (CAT_ICONS[t.categoria]||'') + ' ' + t.categoria;
  document.getElementById('md-sev').textContent = (t.severidade||'media').toUpperCase();
  document.getElementById('md-dif').textContent = (t.dificuldade||'junior').toUpperCase();
  document.getElementById('md-tempo').textContent = t.tempo || '-';
  document.getElementById('md-fer').textContent = t.ferramenta || '-';
  document.getElementById('md-inj').textContent = t.inj || '—';
  document.getElementById('md-desc').textContent = t.descricao || '';
  document.getElementById('md-status').value = t.status;
  document.getElementById('md-notas').value = t.notas || '';
  openModal('modal-ticket');
}

async function moveTicketFromModal() {
  if (!currentTicketId) return;
  const status = document.getElementById('md-status').value;
  try {
    await api('/api/tickets/move', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ticket_id: currentTicketId, status})
    });
    toast('Ticket movido para ' + STATUS_NAMES[status]);
    loadTickets();
    loadInfo();
  } catch(e) {}
}

async function salvarNotas() {
  if (!currentTicketId) return;
  const notas = document.getElementById('md-notas').value;
  try {
    await api('/api/tickets/notas', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ticket_id: currentTicketId, notas})
    });
    toast('Notas salvas');
    closeModal('modal-ticket');
  } catch(e) {}
}

// ═══════════════════════════════════════════════════════
// INJEÇÕES
// ═══════════════════════════════════════════════════════
async function loadCatalog() {
  try {
    const injs = await api('/api/injections');
    const grid = document.getElementById('inj-catalog');
    grid.innerHTML = injs.map(inj => `
      <div class="inj-card">
        <div class="inj-id">${inj.id}</div>
        <div class="inj-title">${inj.t}</div>
        <div class="inj-detail">Arquivos: ${inj.arqs.join(', ')}</div>
        <div class="inj-detail">Sintoma: ${inj.sintoma}</div>
        <div style="margin-top:8px;">
          <button class="btn btn-sm btn-yellow" onclick="injectDefect('${inj.id}')">Injetar</button>
        </div>
      </div>
    `).join('');
  } catch(e) {}
}

async function loadActiveInjections() {
  try {
    const active = await api('/api/injections/active');
    const div = document.getElementById('active-inj-list');
    if (active.length === 0) {
      div.innerHTML = '<p style="color:var(--text2);font-size:12px;">Nenhuma injeção ativa.</p>';
      return;
    }
    div.innerHTML = active.map(a => `
      <div class="active-inj">
        <div class="inj-info">
          <strong style="color:var(--orange);">${a.id}</strong> — ${a.titulo}
          <div style="font-size:11px;color:var(--text2);">Arquivos: ${(a.arquivos||[]).join(', ')}</div>
        </div>
        <button class="btn btn-sm btn-red" onclick="revertInjection('${a.id}')">Reverter</button>
      </div>
    `).join('') + `
      <div style="margin-top:8px;">
        <button class="btn btn-sm btn-red" onclick="revertInjection(null)">Reverter Todas</button>
      </div>
    `;
  } catch(e) {}
}

async function injectDefect(injId) {
  try {
    const res = await api('/api/inject', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({inj_id: injId})
    });
    document.getElementById('mir-id').textContent = res.inj_id;
    document.getElementById('mir-title').textContent = res.titulo;
    document.getElementById('mir-files').textContent = (res.arquivos||[]).join(', ');
    document.getElementById('mir-sintoma').textContent = res.sintoma;
    document.getElementById('mir-dica').textContent = res.dica;
    openModal('modal-inject-result');
    loadActiveInjections();
    loadInfo();
  } catch(e) {}
}

async function revertInjection(injId) {
  try {
    await api('/api/revert', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({inj_id: injId})
    });
    toast(injId ? injId + ' revertida' : 'Todas revertidas');
    loadActiveInjections();
    loadInfo();
  } catch(e) {}
}

// ═══════════════════════════════════════════════════════
// HISTÓRICO
// ═══════════════════════════════════════════════════════
async function loadHistory() {
  try {
    const hist = await api('/api/history');
    const div = document.getElementById('history-list');
    if (hist.length === 0) {
      div.innerHTML = '<p style="color:var(--text2);font-size:12px;">Nenhum registro.</p>';
      return;
    }
    div.innerHTML = '<table class="batch-table"><thead><tr><th>ID</th><th>Título</th><th>Arquivos</th><th>Timestamp</th></tr></thead><tbody>' +
      hist.map(h => `
        <tr>
          <td style="color:var(--orange);font-weight:bold;">${h.id}</td>
          <td>${h.titulo}</td>
          <td style="color:var(--text2);">${(h.arquivos||[]).join(', ')}</td>
          <td style="color:var(--text2);">${h.timestamp || '-'}</td>
        </tr>
      `).join('') + '</tbody></table>';
  } catch(e) {}
}

// ═══════════════════════════════════════════════════════
// AÇÕES GLOBAIS
// ═══════════════════════════════════════════════════════
async function gerarDia() {
  try {
    const res = await api('/api/dia', {method:'POST'});
    const body = document.getElementById('modal-dia-body');
    document.getElementById('modal-dia-title').textContent = `Dia #${res.dia} Gerado`;

    let html = `<div style="margin-bottom:12px;">
      <label>Tickets Gerados (${res.tickets.length})</label>
      <div style="margin-top:4px;">`;
    for (const t of res.tickets) {
      const icon = CAT_ICONS[t.categoria] || '📋';
      html += `<div style="background:var(--bg3);padding:8px;border-radius:4px;margin-bottom:4px;font-size:12px;">
        <span style="color:var(--cyan);">${t.ticket_id}</span> ${icon} ${t.titulo}
        <span class="tag tag-sev-${t.severidade}" style="margin-left:4px;">${t.severidade.toUpperCase()}</span>
      </div>`;
    }
    html += '</div></div>';

    if (res.injectable && res.injectable.length > 0) {
      html += `<label>Injeções Disponíveis</label><div style="margin-top:4px;">`;
      for (const inj of res.injectable) {
        html += `<div style="background:rgba(240,136,62,.1);border:1px solid rgba(240,136,62,.3);padding:8px;border-radius:4px;margin-bottom:4px;font-size:12px;">
          <span style="color:var(--orange);font-weight:bold;">${inj.inj_id}</span> — ${inj.ticket}
          <button class="btn btn-sm btn-yellow" style="margin-left:8px;" onclick="injectDefect('${inj.inj_id}');closeModal('modal-dia');">Injetar</button>
        </div>`;
      }
      html += '</div>';
    }

    // Batch summary
    const batchFailed = res.batch.some(j => j.status === 'error');
    html += `<div style="margin-top:12px;"><label>Batch</label>
      <div style="font-size:12px;margin-top:4px;color:${batchFailed?'var(--red)':'var(--green)'};">
        ${batchFailed ? '⚠ Falha no batch — verifique a grade' : '✓ Batch concluído com sucesso'}
      </div></div>`;

    body.innerHTML = html;
    openModal('modal-dia');
    loadInfo();
    loadTickets();
  } catch(e) {}
}

async function resetar() {
  if (!confirm('Resetar todo o estado do EBOPS? Tickets, injeções e histórico serão perdidos.')) return;
  try {
    await api('/api/reset', {method:'POST'});
    toast('Estado resetado');
    loadInfo();
    loadTickets();
    loadActiveInjections();
    loadHistory();
  } catch(e) {}
}

async function exportar() {
  try {
    const tickets = await api('/api/export');
    const blob = new Blob([JSON.stringify(tickets, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'ebops_tickets_export.json';
    a.click();
    URL.revokeObjectURL(url);
    toast('Exportação concluída');
  } catch(e) {}
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
loadInfo();
loadBatch(false);
</script>
