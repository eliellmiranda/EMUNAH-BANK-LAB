name: EMUNAH-BANK-LAB
description: >-
  Configuracao de property groups para o IBM Z Open Editor no lab EMUNAH-BANK-LAB.
  Define locais especificos de copybooks, JCLs e PROCs para evitar busca global ineficiente.
author: Eliel
propertyGroups:
#  - name: emunah-mvs-remote-cobol
#    language: cobol
#    libraries:
#      - name: syslib
#        type: mvs
#        locations:
#          - ELIEL.EMUNAH.DEV.COPY
#          - Z77948.EMUNAH.DEV.COPY
  - name: emunah-mvs-remote-jcl
    language: jcl
    libraries:
      - name: proclib
        type: mvs
        locations:
          - IGY.V6R4M0.SIGYPROC
          - SYS1.PROCLIB
  - name: emunah-local
    libraries:
      - name: syslib
        type: local
        locations:
          - copybooks/layouts
          - copybooks/db2
          - copybooks/telas
      - name: maclib
        type: local
        locations:
          - copybooks/layouts
      - name: proclib
        type: local
        locations:
          - jcl/batch
          - jcl/compile
          - jcl/deploy
          - jcl/util
          - jcl/hml
          - jcl/prd