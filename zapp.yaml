name: EMUNAH-BANK-LAB
description: >-
  Configuracao de property groups para o IBM Z Open Editor no lab EMUNAH-BANK-LAB.
  Define locais especificos de copybooks, JCLs e PROCs para evitar busca global ineficiente.
author: Eliel
propertyGroups:
  - name: emunah-local
    libraries:
      - name: syslib
        type: local
        locations:
          - copybooks/layouts
          - copybooks/db2
          - copybooks/telas
      - name: maclib
        type: local
        locations:
          - copybooks/layouts
      - name: proclib
        type: local
        locations:
          - jcl/batch
          - jcl/compile
          - jcl/deploy
          - jcl/util
          - jcl/hml
          - jcl/prd
