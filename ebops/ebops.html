<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EBOPS — Emunah Bank Operations Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-0:#060a10;--bg-1:#0c1219;--bg-2:#111b27;--bg-3:#182436;
  --border:#1e3048;--border-h:#2a4060;
  --fg-0:#e2e8f0;--fg-1:#94a3b8;--fg-2:#64748b;--fg-3:#475569;
  --green:#00e676;--green-d:#004d25;
  --red:#ff1744;--orange:#ff6d00;--yellow:#ffab00;--blue:#42a5f5;
  --cyan:#26c6da;--purple:#ab47bc;--teal:#009688;
  --sev-critica:#ff1744;--sev-alta:#ff6d00;--sev-media:#ffab00;--sev-baixa:#00c853;
}
html{font-size:13px}
body{font-family:'IBM Plex Mono',monospace;background:var(--bg-0);color:var(--fg-0);min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg-1)}
::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--border-h)}
a{color:var(--green);text-decoration:none}

/* ── HEADER ── */
.header{background:linear-gradient(135deg,var(--bg-1),var(--bg-2));border-bottom:2px solid var(--green);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:100}
.logo-area{display:flex;align-items:center;gap:10px}
.logo-text{font-size:22px;font-weight:700;color:var(--green);letter-spacing:3px}
.logo-sub{font-size:10px;color:var(--fg-2);letter-spacing:1px;font-family:'IBM Plex Sans',sans-serif}
.tabs{display:flex;gap:2px;background:var(--bg-1);border-radius:6px;padding:3px}
.tab{padding:7px 14px;background:transparent;color:var(--fg-2);border:1px solid transparent;border-radius:4px;cursor:pointer;font-size:11px;font-weight:500;font-family:inherit;transition:all .2s}
.tab:hover{color:var(--fg-1);background:var(--bg-3)}
.tab.active{background:var(--bg-3);color:var(--green);border-color:var(--green);font-weight:600}

/* ── MAIN ── */
.main{padding:16px 20px;max-width:1440px;margin:0 auto}
.section{display:none}.section.active{display:block}

/* ── CARDS ── */
.card{background:var(--bg-2);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;transition:background .15s}
.card-title{font-size:14px;font-weight:600;color:var(--green);margin-bottom:8px;display:flex;align-items:center;gap:8px}

/* ── BUTTONS ── */
.btn{padding:7px 14px;border-radius:4px;cursor:pointer;font-size:11px;font-family:inherit;font-weight:600;transition:all .2s;border:1px solid}
.btn-primary{background:var(--green);color:var(--bg-0);border-color:var(--green)}
.btn-primary:hover{background:#33eb91}
.btn-outline{background:transparent;color:var(--green);border-color:var(--green)}
.btn-outline:hover{background:var(--green-d)}
.btn-danger{background:transparent;color:var(--red);border-color:var(--red)}
.btn-danger:hover{background:#3a0a10}
.btn-blue{background:transparent;color:var(--blue);border-color:var(--blue)}
.btn-blue:hover{background:#0d2137}
.btn-sm{padding:4px 10px;font-size:10px}

/* ── FORM ── */
select,.input{background:var(--bg-3);border:1px solid var(--border);color:var(--fg-0);padding:6px 10px;border-radius:4px;font-size:12px;font-family:inherit}
select:focus,.input:focus{outline:none;border-color:var(--green)}
textarea.input{min-height:100px;resize:vertical;width:100%}

/* ── BADGES ── */
.badge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:.4px;vertical-align:middle}
.badge-critica{background:var(--sev-critica);color:#fff}
.badge-alta{background:var(--sev-alta);color:#fff}
.badge-media{background:var(--sev-media);color:var(--bg-0)}
.badge-baixa{background:var(--sev-baixa);color:var(--bg-0)}
.badge-junior{background:rgba(79,195,247,.15);color:#4fc3f7}
.badge-pleno{background:rgba(171,71,188,.15);color:#ab47bc}
.badge-status{padding:2px 7px;border-radius:3px;font-size:9px;font-weight:700}
.tag{display:inline-block;padding:2px 6px;border-radius:3px;font-size:9px;background:var(--bg-3);color:var(--fg-2);margin:1px}

/* ── STATS ── */
.stats-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.stat-box{background:var(--bg-2);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center;flex:1;min-width:90px}
.stat-num{font-size:26px;font-weight:700}
.stat-label{font-size:10px;color:var(--fg-2);margin-top:3px;text-transform:uppercase;letter-spacing:1px;font-family:'IBM Plex Sans',sans-serif}

/* ── BATCH GRID ── */
.batch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.batch-job{border-radius:6px;padding:10px;text-align:center;border:1px solid}
.batch-job .time{font-size:9px;opacity:.7}
.batch-job .name{font-size:13px;font-weight:700;margin:3px 0}
.batch-job .pgm{font-size:9px;opacity:.8}
.batch-job .rc{font-size:11px;font-weight:600;margin-top:3px}

/* ── TICKET LIST ── */
.ticket-row{cursor:pointer;border-left:3px solid transparent;transition:all .15s}
.ticket-row:hover{background:var(--bg-3)}
.ticket-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:6px}
.ticket-meta{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.ticket-title{font-size:13px;font-weight:600;color:var(--fg-0)}
.ticket-sub{font-size:10px;color:var(--fg-2);margin-top:3px}
.ticket-tags{display:flex;flex-wrap:wrap;gap:2px;margin-top:6px}

/* ── MODAL ── */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.88);z-index:200;display:flex;justify-content:center;align-items:flex-start;padding:16px;overflow:auto}
.modal{background:var(--bg-1);border:1px solid var(--border);border-radius:10px;max-width:820px;width:100%;padding:20px;margin-top:16px;border-top:3px solid var(--green)}
.modal-section{margin-bottom:14px}
.modal-section-title{font-size:12px;font-weight:600;margin-bottom:5px;letter-spacing:.5px}
.modal-section p{font-size:12px;line-height:1.7;color:var(--fg-1)}
.step-item{display:flex;gap:7px;margin-bottom:5px;font-size:11px;line-height:1.5}
.step-num{color:var(--yellow);font-weight:700;min-width:16px}

/* ── TOOL CARD ── */
.tool-card{border-left:2px solid var(--green)}
.tool-card h3{font-size:14px;font-weight:700;color:var(--green);margin-bottom:6px}
.tool-label{font-size:10px;font-weight:600;letter-spacing:.5px;margin-right:4px}
.tool-text{font-size:12px;line-height:1.6;color:var(--fg-1)}

/* ── IMPORT ── */
.import-box{border-color:var(--blue);display:none}
.import-box.show{display:block}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .header{flex-direction:column;align-items:flex-start}
  .tabs{flex-wrap:wrap}
  .stats-row{flex-direction:column}
  .batch-grid{grid-template-columns:repeat(3,1fr)}
}

/* ── ANIMATIONS ── */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card,.stat-box,.batch-job{animation:fadeIn .3s ease}
.ticket-row{animation:fadeIn .25s ease}
</style>
</head>
<body>

<div class="header">
  <div class="logo-area">
    <div>
      <div class="logo-text">EBOPS</div>
      <div class="logo-sub">EMUNAH BANK OPERATIONS SIMULATOR — LOCAL EDITION</div>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
</div>

<div class="main">
  <div class="section active" id="sec-dashboard"></div>
  <div class="section" id="sec-tickets"></div>
  <div class="section" id="sec-catalogo"></div>
  <div class="section" id="sec-ferramentas"></div>
  <div class="section" id="sec-export"></div>
</div>

<div class="modal-overlay" id="modal" style="display:none" onclick="closeModal(event)">
  <div class="modal" id="modal-content" onclick="event.stopPropagation()"></div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
// EBOPS — Emunah Bank Operations Simulator — LOCAL EDITION
// Arquivo HTML único. Abre no navegador. Dados em localStorage.

// ── TEMPLATES COMPLETOS (67) ──────────────────────────────────
const TEMPLATES=[
// ── INCIDENTES (22) ──
{id:"INC-001",titulo:"Abend S0C7 em EBPOST01",ferramenta:"Abendaid / SDSF",categoria:"incidente",severidade:"alta",descricao:"O job EBJPOST abendou com S0C7 no STEP de aplicação de lançamentos. O spool mostra offset 0003A2 no programa EBPOST01.",contexto:"A cadeia batch parou após EBJVALD. Lançamentos validados não foram aplicados. Saldos do dia anterior estão intactos.",passos:["Analisar o spool do EBJPOST no SDSF (JESMSGLG, JESJCL, SYSOUT)","Identificar o offset do abend no listing de compilação","Verificar se houve alteração recente no copybook CPLCT001","Conferir se a massa de entrada tem campo numérico com valor alfabético","Verificar FILE STATUS do OPEN em ARQ.LANCTO.ESDS"],entregavel:"Causa raiz identificada, correção aplicada, evidência de reexecução com RC=00, spool salvo.",tags:["abend","COBOL","spool","troubleshooting"],dificuldade:"pleno",tempo:"45min"},
{id:"INC-002",titulo:"RC=08 em EBJVALD — rejeição acima de 30%",ferramenta:"SDSF / File Manager",categoria:"incidente",severidade:"media",descricao:"O job EBJVALD terminou com RC=08. O relatório mostra 47 registros rejeitados de 100 (47%).",contexto:"A taxa normal de rejeição é abaixo de 5%. 47% indica problema sistêmico na massa ou layout.",passos:["Abrir ARQ.REJEITO.SEQ e analisar motivos mais frequentes","Comparar layout do arquivo de entrada com CPLCT001","Verificar se gerar_lancamentos.py foi alterado","Conferir se contas referenciadas existem em ARQ.CONTA.KSDS","Verificar se há registros com tipo de lançamento inválido"],entregavel:"Análise de causa, correção da massa ou validador, reexecução com taxa normal.",tags:["validação","RC","massa","layout"],dificuldade:"junior",tempo:"30min"},
{id:"INC-003",titulo:"Arquivo de entrada ausente — EBJLOAD falhou",ferramenta:"Zowe CLI / TSO",categoria:"incidente",severidade:"critica",descricao:"O job EBJLOAD falhou porque ARQ.ENTRADA.SEQ não existe ou não está catalogado. Toda a cadeia batch está bloqueada.",contexto:"O arquivo deveria ter sido enviado via upload Zowe CLI antes das 06:00.",passos:["Verificar se o dataset existe: zowe files list ds","Verificar se o upload foi executado","Conferir se o nome do dataset está correto no JCL","Verificar se foi deletado por engano","Documentar horário da detecção e decisão tomada"],entregavel:"Arquivo reenviado, cadeia retomada, evidência do reenvio e reexecução.",tags:["arquivo","bloqueio","cadeia","operação"],dificuldade:"junior",tempo:"20min"},
{id:"INC-004",titulo:"Conciliação divergente — diferença de R$ 150,00",ferramenta:"SDSF / File Manager",categoria:"incidente",severidade:"alta",descricao:"EBJCONC detectou divergência de R$ 150,00 entre lançamentos aplicados e saldo consolidado. EBJEOD bloqueado.",contexto:"A conciliação é última barreira antes do fechamento. R$ 150 pode indicar duplicidade, perda ou erro de cálculo.",passos:["Comparar total de créditos/débitos no relatório de EBJPOST com saldo em ARQ.SALDO.KSDS","Verificar se algum lançamento foi aplicado em duplicidade","Conferir se EBSALD01 soma/subtrai corretamente por tipo","Analisar se houve reprocessamento parcial que duplicou valores","Verificar quantidade de registros em ARQ.LANCTO.ESDS vs relatório de EBJVALD"],entregavel:"Divergência localizada, causa corrigida, conciliação com zero de diferença, evidência antes/depois.",tags:["conciliação","saldo","auditoria","fechamento"],dificuldade:"pleno",tempo:"60min"},
{id:"INC-005",titulo:"FILE STATUS 35 ao abrir ARQ.CONTA.KSDS",ferramenta:"IDCAMS / Zowe CLI",categoria:"incidente",severidade:"alta",descricao:"EBPOST01 retornou FILE STATUS 35 ao abrir arquivo de contas. VSAM KSDS não encontrado.",contexto:"FILE STATUS 35 indica dataset não existe ou não catalogado. Pode ter sido deletado por IDCAMS DELETE sem DEFINE.",passos:["Verificar catálogo: LISTCAT ENT","Verificar se EBSEED.jcl executou DELETE sem DEFINE","Conferir se EBRESET.rexx deletou sem recriar","Verificar DISP no JCL","Recriar via IDCAMS DEFINE e recarregar com EBJCLLD"],entregavel:"Dataset recriado, carga refeita, cadeia retomada, LISTCAT antes/depois.",tags:["VSAM","FILE STATUS","IDCAMS","catálogo"],dificuldade:"junior",tempo:"25min"},
{id:"INC-006",titulo:"Job EBJSALD em HOLD — não executou na janela",ferramenta:"SDSF / Zowe Explorer",categoria:"incidente",severidade:"media",descricao:"EBJSALD aparece HOLD no SDSF. Consolidação não aconteceu, jobs subsequentes aguardando.",contexto:"Pode acontecer por dependência não atendida, intervenção manual ou falha no predecessor.",passos:["Verificar status no SDSF: ST EBJSALD","Verificar se predecessor EBJPOST terminou com sucesso","Verificar se houve HOLD manual","Analisar se o job tem TYPRUN=HOLD no JCL","Liberar via Zowe ou SDSF"],entregavel:"Job liberado, cadeia retomada, causa do HOLD documentada.",tags:["HOLD","scheduler","operação","SDSF"],dificuldade:"junior",tempo:"15min"},
{id:"INC-007",titulo:"Layout divergente — TIPO-LANCTO com tamanho errado",ferramenta:"File Manager / Notepad++",categoria:"incidente",severidade:"media",descricao:"Após atualização do CPLCT001, o arquivo de entrada continua com layout antigo. TIPO-LANCTO mudou de PIC X(01) para PIC X(02).",contexto:"Divergência de layout entre programa e arquivo é um dos erros mais comuns em mainframe.",passos:["Abrir arquivo com layout do copybook atual e verificar desalinhamento","Comparar CPLCT001 atual com versão anterior","Verificar se gerador de massa foi atualizado","Conferir se todos os programas foram recompilados","Testar com registro manual no layout correto"],entregavel:"Massa corrigida, programas recompilados, evidência de execução.",tags:["layout","copybook","File Manager","compilação"],dificuldade:"pleno",tempo:"40min"},
{id:"INC-008",titulo:"Abend S806 — módulo não encontrado na LOADLIB",ferramenta:"SDSF / JCL",categoria:"incidente",severidade:"alta",descricao:"EBJPOST abendou com S806-04. Módulo EBPOST01 não encontrado na biblioteca de carga.",contexto:"S806 indica link-edit não feito ou STEPLIB/LOADLIB errada. Comum após promoção de ambiente.",passos:["Verificar se EBPOST01 existe na LOADLIB via Zowe","Verificar se EBLINK.jcl foi executado após última compilação","Conferir STEPLIB no JCL do EBJPOST","Verificar se houve troca para HML.LOADLIB ou PRD.LOADLIB","Recompilar e religar: EBCOMP → EBLINK"],entregavel:"Módulo recompilado e religado, JCL corrigido, evidência de RC=00.",tags:["abend","S806","LOADLIB","link-edit"],dificuldade:"junior",tempo:"20min"},
{id:"INC-009",titulo:"Saldo negativo detectado em conta corrente",ferramenta:"File Manager / COBOL",categoria:"incidente",severidade:"critica",descricao:"EBCONC01 detectou conta 00001-00001 com saldo -R$ 2.300,00. Regra não permite saldo negativo em CC comum.",contexto:"Pode indicar débito sem validação de suficiência, erro de sinal ou reprocessamento duplicado.",passos:["Consultar saldo da conta em ARQ.SALDO.KSDS","Listar lançamentos da conta em ARQ.LANCTO.ESDS","Verificar se EBPOST01 valida saldo antes de débito","Verificar reprocessamento duplicado","Conferir se tipo de conta permite saldo negativo"],entregavel:"Causa identificada, correção ou estorno, saldo restaurado, auditoria gravada.",tags:["saldo","regra de negócio","auditoria","estorno"],dificuldade:"pleno",tempo:"50min"},
{id:"INC-010",titulo:"GDG ARQ.EXTRATO.GDG não gerou nova geração",ferramenta:"IDCAMS / JCL",categoria:"incidente",severidade:"media",descricao:"EBJEXTR terminou RC=00 mas nova geração do GDG não foi criada. Dataset base pode ter atingido limite.",contexto:"GDG com LIMIT atingido pode descartar geração antiga ou impedir nova, dependendo de EMPTY/NOEMPTY.",passos:["LISTCAT GDG para ver gerações existentes","Verificar LIMIT do GDG base","Verificar se DD no JCL usa (+1)","Conferir se EBEXTR01 gravou registros","Se necessário, redefinir GDG com LIMIT maior"],entregavel:"GDG corrigido, nova geração criada, evidência de LISTCAT e spool.",tags:["GDG","extrato","IDCAMS","gerações"],dificuldade:"junior",tempo:"25min"},
{id:"INC-011",titulo:"Abend S0C4 em EBSALD01 — referência inválida de memória",ferramenta:"Abendaid / SDSF",categoria:"incidente",severidade:"alta",descricao:"EBJSALD abendou com S0C4. Programa tentou acessar memória não alocada.",contexto:"S0C4 indica endereçamento inválido. Pode ser PERFORM VARYING fora do limite, OCCURS DEPENDING ON incorreto ou referência a registro não lido.",passos:["Verificar offset do abend no listing","Identificar tabelas OCCURS e conferir limites","Verificar se READ anterior teve FILE STATUS 00","Conferir se OPEN do VSAM foi bem-sucedido","Verificar PERFORM VARYING com contador fora do limite","Analisar compatibilidade de tamanho do registro com copybook"],entregavel:"Causa raiz do S0C4 identificada, correção aplicada, evidência de RC=00.",tags:["abend","S0C4","memória","tabela","COBOL"],dificuldade:"pleno",tempo:"50min"},
{id:"INC-012",titulo:"REGION insuficiente — S878 no EBJPOST",ferramenta:"JCL / SDSF",categoria:"incidente",severidade:"media",descricao:"EBJPOST cancelado com S878 (insuficiência de memória). Massa com 10.000 registros e REGION de 4M.",contexto:"S878 ocorre quando programa precisa de mais memória que a REGION permite.",passos:["Verificar REGION no JCL","Verificar WORKING-STORAGE com tabelas grandes","Conferir se massa cresceu significativamente","Testar com REGION=0M para confirmar","Avaliar vazamento de memória"],entregavel:"REGION ajustada, job reexecutado, dimensionamento documentado.",tags:["REGION","S878","memória","JCL"],dificuldade:"junior",tempo:"15min"},
{id:"INC-013",titulo:"Dataset locked — ENQ em ARQ.CONTA.KSDS",ferramenta:"SDSF / TSO",categoria:"incidente",severidade:"alta",descricao:"EBJPOST em WAIT porque outro job está com ARQ.CONTA.KSDS alocado com DISP=OLD. Cadeia bloqueada.",contexto:"ENQ é o mecanismo de controle de acesso concorrente do z/OS. DISP=OLD trava o dataset.",passos:["Verificar quem está com dataset alocado: D GRS,RES=","Verificar se há job anterior travado ou sessão TSO aberta","Verificar se EBSEED.jcl roda em paralelo com DISP=OLD","FREE do dataset ou logoff da sessão","Cancelar job que segura o recurso"],entregavel:"Lock liberado, cadeia retomada, documentação sobre concorrência.",tags:["ENQ","lock","DISP","concorrência","VSAM"],dificuldade:"pleno",tempo:"25min"},
{id:"INC-014",titulo:"JCL ERROR — parâmetro inválido no EXEC",ferramenta:"SDSF / JCL",categoria:"incidente",severidade:"media",descricao:"EBJVALD nem executou. SDSF mostra JCL ERROR com IEF631I referente a parâmetro inválido.",contexto:"JCL ERROR é detectado antes da execução. Erro de sintaxe, vírgula faltando ou nome incorreto.",passos:["Abrir JESJCL no spool","Localizar mensagem IEF631I","Verificar sintaxe do EXEC","Verificar continuação de linha sem vírgula na coluna 72","Corrigir e resubmeter"],entregavel:"JCL corrigido, job submetido com sucesso.",tags:["JCL ERROR","sintaxe","EXEC","IEF631I"],dificuldade:"junior",tempo:"10min"},
{id:"INC-015",titulo:"Sequencial de auditoria cheia — B37",ferramenta:"JCL / IDCAMS",categoria:"incidente",severidade:"alta",descricao:"EBJPOST abendou com B37 ao gravar em ARQ.AUDIT.SEQ. Dataset sem espaço.",contexto:"B37 indica extensão máxima atingida. Auditoria nunca pode ser perdida.",passos:["Verificar alocação atual do ARQ.AUDIT.SEQ","Verificar SPACE no JCL de criação","Avaliar volume de registros por dia","Realocar com SPACE maior","Arquivar registros antigos se aplicável","Reexecutar"],entregavel:"Dataset realocado, dimensionamento documentado.",tags:["B37","espaço","auditoria","alocação"],dificuldade:"junior",tempo:"20min"},
{id:"INC-016",titulo:"SORT abendou com RC=16 — entrada vazia",ferramenta:"DFSORT / JCL",categoria:"incidente",severidade:"media",descricao:"STEP de SORT no EBJVALD retornou RC=16. Arquivo de entrada com 0 registros.",contexto:"DFSORT retorna RC=16 com entrada vazia sem OPTION NULLOFL. Pode ser dia sem movimento (feriado) ou falha anterior.",passos:["Verificar se arquivo de entrada tem 0 registros","Verificar RC do step anterior","Avaliar se dia sem movimento é legítimo","Adicionar OPTION NULLOFL se legítimo","Investigar step anterior se ilegítimo"],entregavel:"Causa identificada, SORT ajustado ou step corrigido.",tags:["SORT","RC16","arquivo vazio","DFSORT"],dificuldade:"junior",tempo:"20min"},
{id:"INC-017",titulo:"Timestamp de auditoria gravando zeros",ferramenta:"COBOL / File Manager",categoria:"incidente",severidade:"media",descricao:"Registros de auditoria com data/hora zeradas. EBPOST01 usa ACCEPT que não funciona como esperado.",contexto:"ACCEPT FROM DATE YYYYMMDD e ACCEPT FROM TIME precisam de campos PIC 9 compatíveis.",passos:["Verificar definição dos campos de data/hora no CPAUD001","Conferir ACCEPT FROM DATE YYYYMMDD vs ACCEPT FROM DATE","Verificar se campo é PIC 9(08) e não PIC X(08)","Testar com DISPLAY antes da gravação","Conferir se ACCEPT está dentro do loop correto"],entregavel:"Campo corrigido, timestamp gravando corretamente.",tags:["ACCEPT","timestamp","auditoria","PIC","data"],dificuldade:"junior",tempo:"25min"},
{id:"INC-018",titulo:"VSAM I/O ERROR — CI/CA split em ESDS",ferramenta:"IDCAMS / VSAM",categoria:"incidente",severidade:"alta",descricao:"EBJPOST com performance degradada e I/O error intermitente em ARQ.LANCTO.ESDS.",contexto:"ESDS é append-only e não deveria ter CI splits. Se definido como KSDS por engano, os sintomas aparecem.",passos:["Executar LISTCAT ALL para o dataset","Verificar se foi definido como ESDS de fato","Verificar FREESPACE e CONTROLINTERVALSIZE","Se necessário: REPRO, DELETE, DEFINE correto, reimportar","Monitorar I/O após correção"],entregavel:"Dataset redefinido, dados preservados, performance normalizada.",tags:["VSAM","ESDS","I/O","LISTCAT","performance"],dificuldade:"pleno",tempo:"45min"},
{id:"INC-019",titulo:"SQLCODE -805 — DBRM não encontrado no PLAN",ferramenta:"DB2 / BIND / SDSF",categoria:"incidente",severidade:"alta",descricao:"EBAUDB01 abendou com SQLCODE -805 no primeiro SQL. DBRM não encontrado no PLAN/PACKAGE.",contexto:"-805 significa BIND não executado após pré-compilação. Erro mais comum em promoção de ambiente DB2.",passos:["Verificar se pré-compilador DB2 foi executado","Verificar se BIND foi executado após pré-compilador","Conferir nome do DBRM no BIND","Verificar STEPLIB no JCL","Reexecutar: pré-comp → compilar → linkar → BIND → executar","Verificar catálogo DB2: SYSIBM.SYSPACKAGE"],entregavel:"BIND reexecutado, programa funcional, fluxo documentado.",tags:["DB2","SQLCODE","-805","BIND","DBRM"],dificuldade:"pleno",tempo:"35min"},
{id:"INC-020",titulo:"SQLCODE -911 — deadlock na tabela TB_SALDO",ferramenta:"DB2 / SDSF",categoria:"incidente",severidade:"critica",descricao:"EBAUDC01 recebeu SQLCODE -911 (deadlock/timeout) ao UPDATE em TB_SALDO. Dois jobs competindo.",contexto:"Deadlock ocorre quando dois processos esperam mutuamente liberação de locks.",passos:["Verificar mensagem DSNT376I no spool","Identificar os dois jobs envolvidos","Verificar ordem de acesso às tabelas entre programas","Avaliar COMMIT a cada N registros","Implementar retry logic ao receber -911","Ajustar scheduler para não executar em paralelo"],entregavel:"Deadlock resolvido, retry ou scheduler ajustado, documentação de concorrência DB2.",tags:["DB2","deadlock","-911","lock","concorrência"],dificuldade:"pleno",tempo:"50min"},
{id:"INC-021",titulo:"SQLCODE -811 — SELECT INTO retornou múltiplas linhas",ferramenta:"DB2 / SPUFI",categoria:"incidente",severidade:"media",descricao:"EBAUDB01 recebeu -811 em SELECT INTO para buscar cliente. Query retornou mais de um registro.",contexto:"SELECT INTO é para uma linha. Duplicidade ou WHERE insuficiente causa -811.",passos:["Executar mesma query no SPUFI e contar registros","Verificar duplicidade na tabela","Conferir se WHERE usa chave primária completa","Se duplicidade legítima: trocar por CURSOR","Se ilegítima: corrigir dados e adicionar UNIQUE INDEX"],entregavel:"Causa da duplicidade identificada, SELECT corrigido.",tags:["DB2","SQLCODE","-811","SELECT INTO"],dificuldade:"junior",tempo:"25min"},
{id:"INC-022",titulo:"Encoding corrompido após upload",ferramenta:"Zowe CLI / iconv",categoria:"incidente",severidade:"media",descricao:"Após upload via Zowe CLI, caracteres acentuados nos nomes estão corrompidos. z/OS usa EBCDIC, arquivo local UTF-8.",contexto:"Conversão ASCII/UTF-8 ↔ EBCDIC é fonte constante de problemas.",passos:["Verificar modo TEXT ou BINARY do upload","Verificar code page do dataset no z/OS","Verificar encoding do arquivo local","Testar upload com --encoding explícito","Converter arquivo para ISO-8859-1 antes do upload"],entregavel:"Upload corrigido, encoding documentado.",tags:["encoding","EBCDIC","ASCII","Zowe CLI"],dificuldade:"junior",tempo:"25min"},

const GRADE=[
  {job:"PRECHECK",h:"06:00",pgm:"—",papel:"Valida pré-condições"},
  {job:"EBBACKUP",h:"06:15",pgm:"—",papel:"Registra estado anterior"},
  {job:"EBJLOAD",h:"06:30",pgm:"—",papel:"Prepara arquivo do dia"},
  {job:"EBJVALD",h:"07:00",pgm:"EBVALI01",papel:"Valida layout e regras"},
  {job:"EBJPOST",h:"07:30",pgm:"EBPOST01",papel:"Aplica lançamentos"},
  {job:"EBJSALD",h:"08:00",pgm:"EBSALD01",papel:"Consolida saldos"},
  {job:"EBJEXTR",h:"09:00",pgm:"EBEXTR01",papel:"Gera extratos"},

  {job:"EBJEOD",h:"10:00",pgm:"—",papel:"Fechamento diário"}
];

const JOB_ST={
  ok:{bg:"#0d3320",bd:"#2e7d32",fg:"#a5d6a7",ic:"✓"},
  running:{bg:"#0d2948",bd:"#1565c0",fg:"#90caf9",ic:"▶"},
  warning:{bg:"#4a2800",bd:"#e65100",fg:"#ffcc80",ic:"⚠"},
  error:{bg:"#4a0a0a",bd:"#c62828",fg:"#ef9a9a",ic:"✗"},
  hold:{bg:"#2a0845",bd:"#7b1fa2",fg:"#ce93d8",ic:"⏸"},
  pending:{bg:"#1a2530",bd:"#455a64",fg:"#90a4ae",ic:"◌"}
};

const ST_LABELS={backlog:"Backlog",em_andamento:"Em Andamento",em_revisao:"Em Revisão",concluido:"Concluído"};
const ST_COLORS={backlog:"#546e7a",em_andamento:"#1e88e5",em_revisao:"#ff8f00",concluido:"#43a047"};
const CAT_ICONS={incidente:"🔥",desenvolvimento:"⚙️","operação":"📋",change:"🔄","investigação":"🔍"};

// ── STATE ──
let state={tickets:[],customTemplates:[],day:1,batch:[],batchType:"normal",activeTab:"dashboard",filters:{cat:"todas",sev:"todas",dif:"todas",st:"todas"}};

function load(){
  try{const d=localStorage.getItem("ebops");if(d){const p=JSON.parse(d);Object.assign(state,p)}}catch(e){}
  if(!state.batch||!state.batch.length)state.batch=genBatch("normal");
}
function save(){try{localStorage.setItem("ebops",JSON.stringify(state))}catch(e){}}

function allTemplates(){return[...TEMPLATES,...state.customTemplates]}

function genBatch(type){
  if(type==="normal")return GRADE.map(j=>({...j,st:"ok",rc:"0000"}));
  const fi=Math.floor(Math.random()*GRADE.length);
  const ft=["error","warning","hold"][Math.floor(Math.random()*3)];
  return GRADE.map((j,i)=>{
    if(i<fi)return{...j,st:"ok",rc:"0000"};
    if(i===fi)return{...j,st:ft,rc:ft==="error"?"0012":ft==="warning"?"0004":"HOLD"};
    return{...j,st:"pending",rc:"----"};
  });
}

// ── RENDER ──
function render(){
  renderTabs();
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById("sec-"+state.activeTab).classList.add("active");
  switch(state.activeTab){
    case"dashboard":renderDash();break;
    case"tickets":renderTickets();break;
    case"catalogo":renderCatalog();break;
    case"ferramentas":renderTools();break;
    case"export":renderExport();break;
  }
}

function renderTabs(){
  const t=document.getElementById("tabs");
  const tabs=[
    {id:"dashboard",label:"Dashboard"},
    {id:"tickets",label:`Tickets (${state.tickets.length})`},
    {id:"catalogo",label:`Catálogo (${allTemplates().length})`},
    {id:"ferramentas",label:"Ferramentas"},
    {id:"export",label:"Import/Export"}
  ];
  t.innerHTML=tabs.map(tb=>`<button class="tab ${state.activeTab===tb.id?"active":""}" onclick="switchTab('${tb.id}')">${tb.label}</button>`).join("");
}

function switchTab(id){state.activeTab=id;save();render()}

  </div>
  <div class="card" style="border-color:${state.batchType==="normal"?"var(--border)":"var(--orange)"}">
    <div class="card-title" style="justify-content:space-between;flex-wrap:wrap">
      <span>⏱ CONTROL-M — Grade Batch</span>

        <button class="btn btn-outline btn-sm" onclick="simBatch('normal')">Normal</button>

function gerarDia(){
  const pool=[...allTemplates()];
  const count=Math.floor(Math.random()*3)+2;
  const novo=[];
  for(let i=0;i<count&&pool.length;i++){
    const idx=Math.floor(Math.random()*pool.length);
    const t=pool.splice(idx,1)[0];
    novo.push({...t,ticketId:`EB-${String(state.day).padStart(3,"0")}-${String(i+1).padStart(2,"0")}`,status:"backlog",dia:state.day,notas:"",geradoEm:new Date().toISOString()});
  }
  state.batch=genBatch(Math.random()>.6?"fail":"normal");
  state.batchType=state.batch.some(j=>j.st!=="ok")?"fail":"normal";
  state.tickets=[...novo,...state.tickets];
  state.day++;
  save();render();
}

function simBatch(type){state.batch=genBatch(type);state.batchType=type;save();render()}
function resetAll(){if(!confirm("Resetar todos os tickets, templates customizados e contador de dias?"))return;state={tickets:[],customTemplates:[],day:1,batch:genBatch("normal"),batchType:"normal",activeTab:"dashboard",filters:{cat:"todas",sev:"todas",dif:"todas",st:"todas"}};save();render()}

// ── TICKETS ──
function renderTickets(){
  const f=state.filters;
  const filtered=state.tickets.filter(t=>{
    if(f.cat!=="todas"&&t.categoria!==f.cat)return false;
    if(f.sev!=="todas"&&t.severidade!==f.sev)return false;
    if(f.dif!=="todas"&&t.dificuldade!==f.dif)return false;
    if(f.st!=="todas"&&t.status!==f.st)return false;
    return true;
  });
  let h=`<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
    <span style="color:var(--fg-2);font-size:10px">FILTROS:</span>
    <select class="input" onchange="setFilter('cat',this.value)" style="width:auto"><option value="todas">Todas categorias</option><option value="incidente" ${f.cat==="incidente"?"selected":""}>🔥 Incidentes</option><option value="desenvolvimento" ${f.cat==="desenvolvimento"?"selected":""}>⚙️ Desenvolvimento</option><option value="operação" ${f.cat==="operação"?"selected":""}>📋 Operação</option><option value="change" ${f.cat==="change"?"selected":""}>🔄 Change</option><option value="investigação" ${f.cat==="investigação"?"selected":""}>🔍 Investigação</option></select>
    <select class="input" onchange="setFilter('sev',this.value)" style="width:auto"><option value="todas">Todas severidades</option><option value="critica" ${f.sev==="critica"?"selected":""}>Crítica</option><option value="alta" ${f.sev==="alta"?"selected":""}>Alta</option><option value="media" ${f.sev==="media"?"selected":""}>Média</option><option value="baixa" ${f.sev==="baixa"?"selected":""}>Baixa</option></select>
    <select class="input" onchange="setFilter('dif',this.value)" style="width:auto"><option value="todas">Todas dificuldades</option><option value="junior" ${f.dif==="junior"?"selected":""}>Junior</option><option value="pleno" ${f.dif==="pleno"?"selected":""}>Pleno</option></select>
    <select class="input" onchange="setFilter('st',this.value)" style="width:auto"><option value="todas">Todos status</option><option value="backlog" ${f.st==="backlog"?"selected":""}>Backlog</option><option value="em_andamento" ${f.st==="em_andamento"?"selected":""}>Em Andamento</option><option value="em_revisao" ${f.st==="em_revisao"?"selected":""}>Em Revisão</option><option value="concluido" ${f.st==="concluido"?"selected":""}>Concluído</option></select>
    <span style="color:var(--fg-3);font-size:10px">${filtered.length} resultado(s)</span>
  </div>`;
  if(!filtered.length){
    h+=`<div class="card" style="text-align:center;padding:32px;color:var(--fg-2)">${state.tickets.length?'Nenhum ticket corresponde aos filtros.':'Clique em "GERAR DIA" no Dashboard para começar.'}</div>`;
  }else{
    filtered.forEach(t=>{
      const sc=`badge-${t.severidade}`;
      const dc=`badge-${t.dificuldade}`;
      const stc=ST_COLORS[t.status]||"#546e7a";
      h+=`<div class="card ticket-row" style="border-left-color:var(--sev-${t.severidade})" onclick="openModal('${t.ticketId}')">
        <div class="ticket-header">
          <div style="flex:1">
            <div class="ticket-meta">
              <span style="color:var(--fg-2);font-size:10px;font-weight:600">${t.ticketId}</span>
              <span class="badge ${sc}">${t.severidade.toUpperCase()}</span>
              <span class="badge ${dc}">${t.dificuldade.toUpperCase()}</span>
              <span class="badge-status" style="background:${stc}22;color:${stc}">${ST_LABELS[t.status]}</span>
            </div>
            <div class="ticket-title">${CAT_ICONS[t.categoria]||"📌"} ${t.titulo}</div>
            <div class="ticket-sub">${t.ferramenta} · ${t.tempo} · Dia #${t.dia}</div>
          </div>
          <select class="input" style="width:auto;min-width:120px" onchange="setStatus('${t.ticketId}',this.value);event.stopPropagation()" onclick="event.stopPropagation()">
            ${["backlog","em_andamento","em_revisao","concluido"].map(s=>`<option value="${s}" ${t.status===s?"selected":""}>${ST_LABELS[s]}</option>`).join("")}
          </select>
        </div>
        <div class="ticket-tags">${(t.tags||[]).map(tg=>`<span class="tag">${tg}</span>`).join("")}</div>
      </div>`;
    });
  }
  document.getElementById("sec-tickets").innerHTML=h;
}

function setFilter(key,val){state.filters[key]=val;save();render()}
function setStatus(id,st){const t=state.tickets.find(x=>x.ticketId===id);if(t)t.status=st;save();render()}

// ── MODAL ──
function openModal(id){
  const t=state.tickets.find(x=>x.ticketId===id);if(!t)return;
  const sc=`badge-${t.severidade}`;
  const dc=`badge-${t.dificuldade}`;
  const steps=t.passos||[];
  let h=`
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">
    <div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px">
        <span style="color:var(--fg-2);font-size:11px">${t.ticketId}</span>
        <span class="badge ${sc}">${t.severidade.toUpperCase()}</span>
        <span class="badge ${dc}">${t.dificuldade.toUpperCase()}</span>
      </div>
      <div style="font-size:16px;font-weight:700">${CAT_ICONS[t.categoria]} ${t.titulo}</div>
      <div style="font-size:11px;color:var(--fg-2);margin-top:3px">${t.ferramenta} · ${t.tempo} · Dia #${t.dia}</div>
    </div>
    <button class="btn btn-outline btn-sm" onclick="closeModal()">✕</button>
  </div>
  <div style="display:flex;gap:6px;align-items:center;margin-bottom:14px">
    <span style="color:var(--fg-2);font-size:11px">Status:</span>
    <select class="input" style="width:auto" onchange="setStatus('${t.ticketId}',this.value);openModal('${t.ticketId}')">
      ${["backlog","em_andamento","em_revisao","concluido"].map(s=>`<option value="${s}" ${t.status===s?"selected":""}>${ST_LABELS[s]}</option>`).join("")}
    </select>
  </div>
  <div class="modal-section"><div class="modal-section-title" style="color:var(--green)">DESCRIÇÃO</div><p>${t.descricao}</p></div>`;
  if(t.contexto)h+=`<div class="modal-section"><div class="modal-section-title" style="color:var(--blue)">CONTEXTO BANCÁRIO / MAINFRAME</div><p>${t.contexto}</p></div>`;
  if(steps.length){
    h+=`<div class="modal-section"><div class="modal-section-title" style="color:var(--yellow)">PASSOS / O QUE INVESTIGAR</div>`;
    steps.forEach((s,i)=>h+=`<div class="step-item"><span class="step-num">${i+1}.</span><span>${s}</span></div>`);
    h+=`</div>`;
  }
  if(t.entregavel)h+=`<div class="modal-section"><div class="modal-section-title" style="color:var(--teal)">ENTREGÁVEL</div><p>${t.entregavel}</p></div>`;
  h+=`<div class="ticket-tags" style="margin-bottom:14px">${(t.tags||[]).map(tg=>`<span class="tag">${tg}</span>`).join("")}</div>`;
  h+=`<div class="modal-section"><div class="modal-section-title" style="color:var(--purple)">NOTAS DE TRABALHO</div><textarea class="input" id="modal-notes" onchange="saveNotes('${t.ticketId}')" placeholder="Registre anotações, comandos, descobertas...">${t.notas||""}</textarea></div>`;
  document.getElementById("modal-content").innerHTML=h;
  document.getElementById("modal").style.display="flex";
}

function closeModal(e){if(e&&e.target!==document.getElementById("modal"))return;document.getElementById("modal").style.display="none";render()}
function saveNotes(id){const t=state.tickets.find(x=>x.ticketId===id);if(t)t.notas=document.getElementById("modal-notes").value;save()}

// ── CATALOG ──
function renderCatalog(){
  const cats=[
    {key:"incidente",label:"Incidentes de Produção",ic:"🔥"},
    {key:"desenvolvimento",label:"Demandas de Desenvolvimento",ic:"⚙️"},
    {key:"operação",label:"Operação Batch",ic:"📋"},
    {key:"change",label:"Change Management",ic:"🔄"},
    {key:"investigação",label:"Investigação / Ferramentas",ic:"🔍"},
  ];
  const all=allTemplates();
  let h=`<div style="color:var(--fg-2);font-size:11px;margin-bottom:14px">${all.length} templates disponíveis no pool de sorteio.</div>`;
  cats.forEach(c=>{
    const items=all.filter(t=>t.categoria===c.key);
    if(!items.length)return;
    h+=`<div style="font-size:14px;font-weight:700;color:var(--green);margin:16px 0 8px;border-bottom:1px solid var(--border);padding-bottom:5px">${c.ic} ${c.label} (${items.length})</div>`;
    items.forEach(t=>{
      h+=`<div class="card" style="border-left:2px solid var(--sev-${t.severidade});padding:10px 14px">
        <div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:3px">
          <span style="color:var(--fg-2);font-size:10px">${t.id}</span>
          <span class="badge badge-${t.severidade}">${t.severidade.toUpperCase()}</span>
          <span class="badge badge-${t.dificuldade}">${t.dificuldade.toUpperCase()}</span>
          <span style="color:var(--fg-3);font-size:10px">${t.ferramenta} · ${t.tempo}</span>
        </div>
        <div style="font-size:12px;font-weight:600">${t.titulo}</div>
        <div style="font-size:11px;color:var(--fg-1);margin-top:3px;line-height:1.5">${t.descricao}</div>
        <div class="ticket-tags" style="margin-top:5px">${(t.tags||[]).map(tg=>`<span class="tag">${tg}</span>`).join("")}</div>
      </div>`;
    });
  });
  if(state.customTemplates.length){
    h+=`<div style="font-size:14px;font-weight:700;color:var(--cyan);margin:16px 0 8px;border-bottom:1px solid var(--border);padding-bottom:5px">📦 Templates Customizados (${state.customTemplates.length})</div>`;
    state.customTemplates.forEach(t=>{
      h+=`<div class="card" style="border-left:2px solid var(--cyan);padding:10px 14px">

        <div style="font-size:11px;color:var(--fg-1);margin-top:3px">${t.descricao}</div>
      </div>`;
    });
  }
  document.getElementById("sec-catalogo").innerHTML=h;
}

// ── IMPORT/EXPORT ──
function renderExport(){
  let h=`
  <div class="card" style="border-color:var(--blue)">
    <div class="card-title" style="color:var(--blue)">⬆ Importar Templates Personalizados (JSON)</div>
    <div style="font-size:10px;color:var(--fg-2);margin-bottom:8px">Campos obrigatórios: titulo, categoria, descricao. Opcionais: severidade, ferramenta, dificuldade, tempo, tags, passos, entregavel, contexto.</div>
    <textarea class="input" id="import-area" placeholder='[{"titulo":"...","categoria":"incidente","descricao":"...","severidade":"alta","ferramenta":"SDSF","dificuldade":"pleno","tempo":"30min","tags":["custom"],"passos":["Passo 1","Passo 2"],"entregavel":"..."}]'></textarea>
    <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
      <button class="btn btn-primary" onclick="importTemplates()">IMPORTAR</button>
      <span id="import-msg" style="font-size:11px"></span>
    </div>
  </div>
  <div class="card" style="margin-top:12px">
    <div class="card-title">⬇ Exportar Tickets</div>
    <div style="font-size:10px;color:var(--fg-2);margin-bottom:8px">Exporta todos os tickets com status e notas para arquivo JSON.</div>
    <button class="btn btn-outline" onclick="exportTickets()">EXPORTAR TICKETS (.json)</button>
  </div>
  <div class="card" style="margin-top:12px">
    <div class="card-title">⬇ Exportar Templates Customizados</div>
    <div style="font-size:10px;color:var(--fg-2);margin-bottom:8px">Exporta seus templates customizados para reutilizar ou compartilhar.</div>
    <button class="btn btn-outline" onclick="exportCustom()">EXPORTAR TEMPLATES (.json)</button>
    ${state.customTemplates.length?`<button class="btn btn-danger btn-sm" style="margin-left:8px" onclick="clearCustom()">LIMPAR CUSTOMIZADOS (${state.customTemplates.length})</button>`:""}
  </div>`;
  document.getElementById("sec-export").innerHTML=h;
}

function importTemplates(){
  const raw=document.getElementById("import-area").value;
  const msg=document.getElementById("import-msg");
  try{
    const parsed=JSON.parse(raw);
    const arr=Array.isArray(parsed)?parsed:[parsed];
    const valid=arr.filter(t=>t.titulo&&t.categoria&&t.descricao);
    if(!valid.length){msg.style.color="var(--red)";msg.textContent="Nenhum template válido. Campos: titulo, categoria, descricao.";return}
    const withId=valid.map((t,i)=>({id:t.id||`CUSTOM-${Date.now()}-${i}`,titulo:t.titulo,categoria:t.categoria,descricao:t.descricao,contexto:t.contexto||"",ferramenta:t.ferramenta||"Geral",severidade:t.severidade||"media",dificuldade:t.dificuldade||"junior",tempo:t.tempo||t.tempo_estimado||"30min",tags:t.tags||[],passos:t.passos||t.o_que_investigar||t.passos_esperados||[],entregavel:t.entregavel||""}));
    state.customTemplates.push(...withId);
    save();
    msg.style.color="var(--green)";msg.textContent=`${withId.length} template(s) importado(s)!`;
    document.getElementById("import-area").value="";
    renderTabs();
  }catch(e){msg.style.color="var(--red)";msg.textContent="JSON inválido. Verifique a formatação."}
}

function exportTickets(){downloadJSON(state.tickets,"ebops-tickets.json")}
function exportCustom(){downloadJSON(state.customTemplates,"ebops-custom-templates.json")}
function clearCustom(){if(!confirm("Remover todos os templates customizados?"))return;state.customTemplates=[];save();render()}

function downloadJSON(data,filename){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;a.click();URL.revokeObjectURL(a.href);
}

// ── INIT ──
load();
render();
</script>
